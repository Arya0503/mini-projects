<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thala 7 | Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <span class="logo-text">Thala <span class="blue-text">7.</span></span>
        </div>
        <ul class="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="product.html">Product</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="checkout.html">Checkout</a></li>
        </ul>
        <div class="icons">
            <span>🔍</span>
            <span>🛒 0</span>
            <span>👤</span>
        </div>
    </nav>

    <!-- PRODUCT DISPLAY SECTION -->
    <section class="page-section">
        <div class="split-layout">
            <div class="product-left">
                <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500" alt="Main Shoe" class="main-image">
                <div class="bottom-gallery">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=150" alt="Thumb 1">
                    <img src="https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=150" alt="Thumb 2">
                    <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=150" alt="Thumb 3">
                </div>
            </div>
            
            <div class="product-right">
                <h2>Seven By M.S.Dhoni Women's Hogun Multi-Color Running Shoes</h2>
                <p class="product-desc">For exceptional fit, feel and smooth transitions get going with these dual-mid sole technology shoes.</p>
                
                <div class="price-box">
                    <h3 class="price">₹ 1,334</h3>
                    <p class="sale-details">Save 12%<br>Inclusive of all Taxes</p>
                </div>
                
                <div class="add-to-cart-box">
                    <input type="number" value="2" class="qty-input">
                    <!-- Links to the Cart page -->
                    <a href="cart.html"><button class="orange-btn">🛒 ADD TO CART</button></a>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
