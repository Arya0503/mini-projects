<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Mart Login</title>
    <!-- Linking to index.css as requested -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Main Container -->
    <div class="login-container">
        
        <!-- Left Side: Illustration -->
        <div class="left-section">
            <img src="https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?q=80&w=500&auto=format&fit=crop" alt="Laundry Service">
        </div>

        <!-- Right Side: Login Form -->
        <div class="right-section">
            <div class="form-header">
                <h2>Hello Again!</h2>
                <p>Welcome back! we missed you!</p>
            </div>

            <form class="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Emailid@site.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <div class="forgot-password">
                    <a href="#">Forgot Password</a>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="register-link">
                <p>Not a member? <a href="#">Register Now</a></p>
            </div>
        </div>

    </div>

</body>
</html>
