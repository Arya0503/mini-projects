<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Hero Landing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-orange-50 to-white min-h-screen font-sans text-gray-900 overflow-x-hidden">

    
    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-sm border-b border-gray-100 py-4 px-6 md:px-12 flex justify-between items-center">
        <!-- Logo -->
        <div class="text-xl font-bold flex items-center gap-2">
            <span>✦</span> Project
        </div>
        
        <ul class="hidden md:flex gap-8 text-sm font-medium text-gray-600">
            <li class="hover:text-black cursor-pointer">Product</li>
            <li class="hover:text-black cursor-pointer">Solutions</li>
            <li class="hover:text-black cursor-pointer">Resources</li>
            <li class="hover:text-black cursor-pointer">Pricing</li>
            <li class="hover:text-black cursor-pointer">Log in</li>
        </ul>

              <button class="bg-slate-900 text-white text-sm px-5 py-2 rounded-md hover:bg-slate-800">
            Get AI free
        </button>
    </nav>

    
    <main class="pt-24 pb-32 text-center max-w-5xl mx-auto px-6">
        
   
        <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-6 text-slate-900">
            Write, plan, share.<br>With AI at your side.
        </h1>
        
               <p class="text-lg text-gray-500 mb-12 max-w-2xl mx-auto">
            It is the connected workspace where better, faster work happens. Now with AI.
        </p>

       
        <div class="relative w-[340px] mx-auto h-12 mb-20">
            <button class="absolute left-0 top-0 bg-slate-900 text-white font-medium px-6 py-3 rounded-md hover:bg-slate-800">
                Get AI free &rarr;
            </button>
            <button class="absolute right-0 top-0 bg-blue-600 text-white font-medium px-6 py-3 rounded-md hover:bg-blue-700">
                Request a demo
            </button>
        </div>
        <div class="relative w-full h-[300px] md:h-[450px]">
            
            <img 
                src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?q=80&w=1000&auto=format&fit=crop" 
                alt="Dashboard Preview" 
                class="absolute left-1/2 -translate-x-1/2 top-0 w-4/5 md:w-2/3 h-full object-cover rounded-xl shadow-2xl z-10 border border-gray-200"
            >

            <div class="absolute left-0 md:left-10 top-20 bg-white p-3 md:p-4 rounded-xl shadow-xl z-20 border border-gray-100 flex items-center gap-3">
                <div class="bg-purple-100 p-2 rounded-lg text-lg">📋</div>
                <div class="text-sm font-semibold text-gray-800 text-left">
                    Tasks<br><span class="text-xs text-gray-500 font-normal">12 tasks completed today</span>
                </div>
            </div>


            <div class="absolute right-0 md:right-10 top-12 bg-white p-3 md:p-4 rounded-xl shadow-xl z-20 border border-gray-100 flex items-center gap-3">
                <div class="bg-green-100 p-1 rounded-md text-green-600 font-bold text-sm">✓</div>
                <div class="text-sm font-semibold text-gray-800 text-left">
                    Project Status<br><span class="text-xs text-green-500 font-normal">On Track</span>
                </div>
            </div>

            <div class="absolute right-10 md:right-24 -bottom-6 bg-white p-3 md:p-4 rounded-xl shadow-xl z-20 border border-gray-100 flex flex-col items-start gap-2">
                <div class="text-sm font-semibold text-gray-800">Team Activity</div>
                <div class="flex items-center gap-2">
               
                    <div class="flex -space-x-2">
                        <div class="w-6 h-6 rounded-full bg-blue-500 border border-white"></div>
                        <div class="w-6 h-6 rounded-full bg-red-500 border border-white"></div>
                        <div class="w-6 h-6 rounded-full bg-yellow-500 border border-white"></div>
                    </div>
                    <span class="text-xs text-gray-500 font-normal">+5 online</span>
                </div>
            </div>

        </div>
    </main>

       <div class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white p-4 rounded-full shadow-2xl cursor-pointer hover:bg-slate-800">
        💬
    </div>

</body>
</html>
