<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Button Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero-section">
        <div class="hero-text">
