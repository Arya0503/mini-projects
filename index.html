<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive DOM Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- The header we will update -->
        <h1 id="greeting">Hello</h1>

        <!-- The four color boxes -->
        <div class="color-boxes">
            <!-- Using the color names as IDs makes the JS logic much easier -->
            <div class="box" id="red">Red</div>
            <div class="box" id="blue">Blue</div>
            <div class="box" id="green">Green</div>
            <div class="box" id="yellow">Yellow</div>
        </div>

        <!-- The input and greet button -->
        <div class="input-section">
            <input type="text" id="nameInput" placeholder="Enter your name">
            <button id="greetBtn">Greet</button>
        </div>
    </div>

    <!-- Link JS at the bottom so the HTML loads first -->
    <script src="script.js"></script>
</body>
</html>
