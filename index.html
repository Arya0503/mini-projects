<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Hero Landing Page</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans text-slate-900 antialiased overflow-x-hidden">

    <!-- 
      NAVIGATION SECTION
      Using 'sticky top-0 z-50' to keep it fixed at the top while scrolling.
    -->
    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <!-- Logo -->
            <div class="text-xl font-bold flex items-center gap-2">
                <span class="text-2xl">✦</span> Project
            </div>
            
            <!-- Navigation Links -->
            <ul class="hidden md:flex gap-8 text-sm font-medium text-gray-600">
                <li class="hover:text-black cursor-pointer">Product</li>
                <li class="hover:text-black cursor-pointer">Solutions</li>
                <li class="hover:text-black cursor-pointer">Resources</li>
                <li class="hover:text-black cursor-pointer">Pricing</li>
                <li class="hover:text-black cursor-pointer">Log in</li>
            </ul>

            <!-- CTA Button -->
            <button class="bg-slate-900 text-white text-sm font-medium px-5 py-2.5 rounded-lg hover:bg-slate-800 transition">
                Get AI free
            </button>
        </div>
    </nav>

    <!-- 
      HERO SECTION
      Using 'bg-gradient-to-b' for the light orange to white fade.
    -->
    <main class="bg-gradient-to-b from-orange-50 to-white pt-24 pb-32">
        <div class="max-w-4xl mx-auto px-6 text-center">
            
            <!-- Headline -->
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 text-slate-900">
                Write, plan, share.<br>With AI at your side.
            </h1>
            
            <!-- Description -->
            <p class="text-lg md:text-xl text-gray-600 mb-10 max-w-2xl mx-auto">
                It is the connected workspace where better, faster work happens. Now with AI.
            </p>

            <!-- 
              CTA BUTTONS
              Using a relative wrapper to fulfill the assignment constraints.
            -->
            <div class="relative flex flex-col sm:flex-row justify-center items-center gap-4 mb-20">
                <button class="bg-slate-900 text-white font-medium px-6 py-3 rounded-lg hover:bg-slate-800 transition">
                    Get AI free &rarr;
                </button>
                <button class="bg-blue-600 text-white font-medium px-6 py-3 rounded-lg hover:bg-blue-700 transition">
                    Request a demo
                </button>
            </div>

            <!-- 
              DASHBOARD PREVIEW & FLOATING CARDS
              The parent is 'relative' so the 'absolute' children stay contained within this block.
            -->
            <div class="relative w-full max-w-5xl mx-auto h-[300px] md:h-[500px]">
                
                <!-- Main Dashboard Image (Absolute Center) -->
                <img 
                    src="https://images.unsplash.com/photo-1531403009284-440f080d1e12?q=80&w=1000&auto=format&fit=crop" 
                    alt="Dashboard Preview" 
                    class="absolute top-0 left-1/2 -translate-x-1/2 w-4/5 md:w-3/4 rounded-xl shadow-2xl z-0 border border-gray-200 object-cover h-full"
                >

                <!-- Floating Card 1: Tasks (Absolute Top Left) -->
                <div class="absolute top-10 left-0 md:-left-10 bg-white p-3 md:p-4 rounded-xl shadow-xl z-10 border border-gray-100 flex items-center gap-3">
                    <div class="bg-orange-100 p-2 rounded-lg text-xl">📋</div>
                    <div class="text-sm md:text-base font-semibold text-gray-800">
                        Tasks<br><span class="text-xs text-gray-500 font-normal">12 tasks completed today</span>
                    </div>
                </div>

                <!-- Floating Card 2: Project Status (Absolute Top Right) -->
                <div class="absolute top-32 right-0 md:-right-8 bg-white p-3 md:p-4 rounded-xl shadow-xl z-10 border border-gray-100 flex items-center gap-3">
                    <div class="bg-green-100 p-2 rounded-lg text-green-600 text-xl">✓</div>
                    <div class="text-sm md:text-base font-semibold text-gray-800">
                        Project Status<br><span class="text-xs text-green-500 font-normal">On Track</span>
                    </div>
                </div>

                <!-- Floating Card 3: Team Activity (Absolute Bottom Left) -->
                <div class="absolute -bottom-6 left-10 md:left-20 bg-white p-3 md:p-4 rounded-xl shadow-xl z-10 border border-gray-100 flex items-center gap-3">
                    <div class="flex -space-x-2">
                        <div class="w-8 h-8 rounded-full bg-blue-500 border-2 border-white"></div>
                        <div class="w-8 h-8 rounded-full bg-red-500 border-2 border-white"></div>
                        <div class="w-8 h-8 rounded-full bg-yellow-500 border-2 border-white"></div>
                    </div>
                    <div class="text-sm md:text-base font-semibold text-gray-800">
                        Team Activity<br><span class="text-xs text-gray-500 font-normal">+5 online</span>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- 
      FIXED CHAT WIDGET
      Using 'fixed bottom-6 right-6 z-50' to lock it to the screen viewport.
    -->
    <button class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform">
        <span class="text-2xl">💬</span>
    </button>

</body>
</html>
