<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thala 7 | Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <span class="logo-text">Thala <span class="blue-text">7.</span></span>
        </div>
        <ul class="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="product.html">Product</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="checkout.html">Checkout</a></li>
        </ul>
        <div class="icons">
            <span>🔍</span>
            <span>🛒 2</span>
            <span>👤</span>
        </div>
    </nav>

    <!-- SHOPPING CART SECTION -->
    <section class="page-section">
        <h2>Shopping Cart</h2>
        <div class="split-layout">
            <div class="cart-left">
                <div class="cart-row heading-row">
                    <span>Product</span>
                    <span>Quantity</span>
                    <span>Price</span>
                </div>
                <div class="cart-row">
                    <span>Seven By M.S.Dhoni...</span>
                    <span>- 1 +</span>
                    <span>₹1,334</span>
                    <span class="remove-icon">❌</span>
                </div>
                <div class="cart-row">
                    <span>Seven By M.S.Dhoni...</span>
                    <span>- 1 +</span>
                    <span>₹1,334</span>
                    <span class="remove-icon">❌</span>
                </div>
                <br>
                <a href="index.html" class="continue-link">< Continue Shopping</a>
            </div>
            
            <div class="cart-right">
                <div class="coupon-box">
                    <div>
                        <p style="margin: 0 0 5px 0;">Enter Coupon Code</p>
                        <input type="text" placeholder="COUPON CODE">
                    </div>
                    <button class="blue-btn">Apply</button>
                </div>
                <div class="totals-box">
                    <p>Sub Total: <span>₹2,668</span></p>
                    <p>Taxes: <span>₹199</span></p>
                    <p>Discount: <span>₹0</span></p>
                    <h3>Total: <span>₹2,867</span></h3>
                </div>
                <!-- Links to Checkout -->
                <a href="checkout.html"><button class="orange-btn full-width mt-20">Checkout</button></a>
            </div>
        </div>
    </section>

</body>
</html>
